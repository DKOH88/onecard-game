            discardEl.innerHTML = topCards.map((card, idx) => {
                const isTop = idx === topCards.length - 1;
                const isNormalSuit = ['spade', 'heart', 'diamond', 'club'].includes(card.suit);
                const valueClass = isNormalSuit ? `val-${card.value}` : '';
                const opacity = '1'; // 투명도 제거
                return `
                    <div class="card ${card.suit} ${valueClass}"
                         style="width:${isTop ? 60 : 45}px;height:${isTop ? 85 : 65}px;opacity:${opacity};cursor:default;position:relative;z-index:${idx + 10};">
                    </div>
                `;
            }).join('');

            document.getElementById('action-buttons').style.display = selectedCards.length > 0 ? 'flex' : 'none';

            // 낼 카드가 없으면 덱 하이라이트
            const deckEl = document.querySelector('.deck');
            if (deckEl) deckEl.classList.remove('highlight');

            const currentP = players[singlePlayerState.currentPlayerIndex];
            if (currentP && currentP.isHuman) {
                const hasPlayable = currentP.hand.some(card => canPlayCardSingle(card));
                if (!hasPlayable && deckEl) {
                    deckEl.classList.add('highlight');
                }
            }
        }

        function canPlayCardSingle(card) {
            if (singlePlayerState.attackStack > 0) {
                return canDefendWithSingle(card);
            }
            const topCard = singlePlayerState.discardPile[singlePlayerState.discardPile.length - 1];

            // 조커 공격 피해 후 아무 카드나 낼 수 있음
            if (singlePlayerState.currentSuit === 'any') return true;

            if (card.suit === 'black-joker' || card.suit === 'color-joker') return true;
            if (card.suit === singlePlayerState.currentSuit) return true;
            if (card.value === topCard.value) return true;
            return false;
        }

        function canDefendWithSingle(card) {
            const attackType = singlePlayerState.attackType;
            if (!attackType) return true;

            if (attackType === '2') {
                if (card.value === '2') return true;
                if (card.value === 'A' && card.suit === singlePlayerState.currentSuit) return true;
                if (card.suit === 'black-joker' || card.suit === 'color-joker') return true;
                return false;
            }
            if (attackType === 'A') {
                if (card.value === 'A') return true;
                if (card.suit === 'black-joker' || card.suit === 'color-joker') return true;
                return false;
            }
            if (attackType === 'black-joker' || attackType === 'color-joker') {
                if (card.value === 'A' && card.suit === 'spade') return true;
                if (card.suit === 'black-joker' || card.suit === 'color-joker') return true;
                return false;
            }
            return false;
        }

        function toggleCardSelectionSingle(index) {
            const currentPlayer = players[singlePlayerState.currentPlayerIndex];
            if (!currentPlayer || !currentPlayer.isHuman) return;

            const card = currentPlayer.hand[index];

            const idx = selectedCards.indexOf(index);
            if (idx > -1) {
                // 이미 선택된 카드 해제
                selectedCards.splice(idx, 1);
            } else {
                if (selectedCards.length > 0) {
                    // 이미 선택된 카드가 있으면 같은 숫자만 허용
                    const firstCard = currentPlayer.hand[selectedCards[0]];
                    if (card.value !== firstCard.value) {
                        alert('같은 숫자의 카드만 함께 낼 수 있습니다!');
                        return;
                    }
                    selectedCards.push(index);
                } else {
                    // 첫 번째 카드는 플레이 가능해야 함
                    if (!canPlayCardSingle(card)) return;
                    selectedCards.push(index);
                }
            }
            renderSingle();
        }

        function playSelectedCardsOnline() {
            if (isSinglePlayer) {
                playSelectedCardsSingle();
            } else {
                playSelectedCardsOnlineOriginal();
            }
        }

        function playSelectedCardsSingle() {
            if (selectedCards.length === 0) return;

            const player = players.find(p => p.isHuman);
            const cards = selectedCards.map(i => player.hand[i]);

            selectedCards.sort((a, b) => b - a).forEach(i => player.hand.splice(i, 1));
            cards.forEach(card => singlePlayerState.discardPile.push(card));
            playCardPlaySound(); // 소리 추가 (싱글 내부)

            const lastCard = cards[cards.length - 1];
            if (lastCard.suit !== 'black-joker' && lastCard.suit !== 'color-joker') {
                singlePlayerState.currentSuit = lastCard.suit;
            }

            handleSpecialCardsSingle(cards);
            selectedCards = [];

            if (player.hand.length === 0) {
                const currentRank = players.filter(p => p.rank !== null).length + 1;
                player.rank = currentRank;
                setMessage(`🎉 ${player.name}님이 ${currentRank}등으로 탈출!`);
                renderSingle();
                if (isGameOverSingle()) {
                    setTimeout(endGameSingle, 1500);
                } else {
                    setTimeout(nextTurnSingle, 1500);
                }
                return;
            }

            if (cards[0].value === '7' && cards[0].suit !== 'black-joker' && cards[0].suit !== 'color-joker') {
                document.getElementById('suit-selector').style.display = 'flex';
                return;
            }

            // 특수 카드(공격/방어/스킵) 사용 시 메시지 확인을 위해 딜레이 추가
            const isSpecial = ['A', '2', 'K', 'Q', 'J'].includes(cards[0].value) ||
                cards[0].suit.includes('joker');

            if (isSpecial) {
                setTimeout(nextTurnSingle, 2000);
            } else {
                nextTurnSingle();
            }
        }

        function handleSpecialCardsSingle(cards) {
            const value = cards[0].value;
            const count = cards.length;

            // 조커 감지 (온라인과 동일하게 some() 사용)
            const hasBlackJoker = cards.some(c => c.suit === 'black-joker');
            const hasColorJoker = cards.some(c => c.suit === 'color-joker');

            if (value === '2') {
                console.log(`💥 Special Card '2' detected! Stack += ${2 * count}`);
                singlePlayerState.attackStack += 2 * count;
                singlePlayerState.attackType = '2';
                setMessage(`⚔️ +${2 * count}장! (누적: ${singlePlayerState.attackStack}장)`, 'attack');
            } else if (value === 'A') {
                console.log(`💥 Special Card 'A' detected! Stack += ${3 * count}`);
                singlePlayerState.attackStack += 3 * count;
                singlePlayerState.attackType = 'A';
                setMessage(`⚔️ +${3 * count}장! (누적: ${singlePlayerState.attackStack}장)`, 'attack');
            } else if (hasBlackJoker) {
                console.log(`💥 Special Card 'Black Joker' detected! Stack += ${5 * count}`);
                singlePlayerState.attackStack += 5 * count;
                singlePlayerState.attackType = 'black-joker';
                setMessage(`🖤 +${5 * count}장!`, 'attack');
            } else if (hasColorJoker) {
                console.log(`💥 Special Card 'Color Joker' detected! Stack += ${7 * count}`);
                singlePlayerState.attackStack += 7 * count;
                singlePlayerState.attackType = 'color-joker';
                setMessage(`🌈 +${7 * count}장!`, 'attack');
            } else if (value === 'K') {
                const activeCount = players.filter(p => !p.isBankrupt && p.rank === null).length;
                let kSkips = 0;

                if (activeCount <= 2) {
                    // 2인: 짝수 장(내 턴), 홀수 장(상대 턴)
                    kSkips = (count * 2);
                    if (count % 2 === 0) kSkips -= 1;
                } else {
                    // 3인 이상: 1장당 3칸 이동 (2명 건너뛰기)
                    // 기본 1칸 + 스킵 (count*3 - 1)
                    kSkips = (count * 3) - 1;
                }

                singlePlayerState.skipTurns += kSkips;
                singlePlayerState.attackStack = 0;
                singlePlayerState.attackType = null;
                setMessage(`👑 ${kSkips}턴 스킵!`);
            } else if (value === 'Q') {
                const activeCount = players.filter(p => !p.isBankrupt && p.rank === null).length;
                if (activeCount <= 2) {
                    singlePlayerState.skipTurns += 1 * count;
                    setMessage(`👸 ${count}턴 스킵!`);
                } else if (count % 2 === 1) {
                    singlePlayerState.direction *= -1;
                    setMessage(`👸 방향 전환! ${singlePlayerState.direction === 1 ? '⟳' : '⟲'}`);
                }
                singlePlayerState.attackStack = 0;
                singlePlayerState.attackType = null;
            } else if (value === 'J') {
                const activeCount = players.filter(p => !p.isBankrupt && p.rank === null).length;
                let jSkips = 0;

                if (activeCount <= 2) {
                    jSkips = count; // 2인은 1장당 1스킵 (기존 유지)
                } else {
                    // 3인 이상: 1장당 2칸 이동 (1명 건너뛰기)
                    // 기본 1칸 + 스킵 (count*2 - 1)
                    jSkips = (count * 2) - 1;
                }

                singlePlayerState.skipTurns += jSkips;
                singlePlayerState.attackStack = 0;
                singlePlayerState.attackType = null;
                setMessage(`🎭 ${jSkips}턴 스킵!`);
            } else {
                // 일반 카드도 공격 초기화
                singlePlayerState.attackStack = 0;
                singlePlayerState.attackType = null;
            }
        }

        function selectSuitOnline(suit) {
            if (isSinglePlayer) {
                singlePlayerState.currentSuit = suit;
                document.getElementById('suit-selector').style.display = 'none';

                // 무늬 변경 알림 팝업 (색상 적용)
                const suitNameText = { 'spade': '♠ 스페이드', 'heart': '♥ 하트', 'diamond': '♦ 다이아몬드', 'club': '♣ 클로버' };
                const humanPlayer = players.find(p => p.isHuman);
                const playerName = humanPlayer ? humanPlayer.name : '플레이어';
                showNotification(`${playerName}님이 문양을 ${suitNameText[suit]} (으)로 바꿨습니다!`);
                playSuitChangeSound(); // 소리 추가

                setMessage(`♻️ ${suitSymbols[suit]} 선택!`);

                // 7카드로 마지막 카드를 냈을 때 승리 체크 (온라인과 동일)
                if (humanPlayer && humanPlayer.hand.length === 0) {
                    const currentRank = players.filter(p => p.rank !== null).length + 1;
                    humanPlayer.rank = currentRank;
                    setMessage(`🎉 ${humanPlayer.name}님이 ${currentRank}등으로 탈출!`);
                    renderSingle();
                    if (isGameOverSingle()) {
                        setTimeout(endGameSingle, 1500);
                    } else {
                        setTimeout(nextTurnSingle, 1500);
                    }
                    return;
                }

                nextTurnSingle();
            } else {
                selectSuitOnlineOriginal(suit);
            }
        }

        function drawCardOnline() {
            if (isSinglePlayer) {
                drawCardSingle();
            } else {
                drawCardOnlineOriginal();
            }
        }

        function drawCardSingle() {
            const player = players.find(p => p.isHuman);
            if (!player || player.isBankrupt) return;
            if (singlePlayerState.currentPlayerIndex !== players.indexOf(player)) {
                alert('당신의 턴이 아닙니다!');
                return;
            }
            drawCardsForPlayerSingle(player);
            nextTurnSingle();
        }

        function drawCardsForPlayerSingle(player) {
            const count = singlePlayerState.attackStack > 0 ? singlePlayerState.attackStack : 1;

            for (let i = 0; i < count; i++) {
                if (singlePlayerState.deck.length === 0) reshuffleDeckSingle();
                if (singlePlayerState.deck.length > 0) {
                    player.hand.push(singlePlayerState.deck.pop());
                    if (player.isHuman) playCardDrawSound(); // 소리 추가
                }
            }

            if (singlePlayerState.attackStack > 0) {
                // 조커 공격 후 카드를 먹으면 다음 사람은 아무 카드나 낼 수 있음
                const wasJokerAttack = singlePlayerState.attackType === 'black-joker' || singlePlayerState.attackType === 'color-joker';
                if (wasJokerAttack) {
                    singlePlayerState.currentSuit = 'any';
                }
                setMessage(`💥 ${player.name} ${singlePlayerState.attackStack}장 뽑음!`);
                singlePlayerState.attackStack = 0;
                singlePlayerState.attackType = null;
            } else {
                setMessage(`📥 ${player.name} 1장 뽑음`);
            }

            if (player.hand.length > BANKRUPT_LIMIT) {
                player.isBankrupt = true;
                singlePlayerState.deck.push(...player.hand);
                player.hand = [];
                shuffle(singlePlayerState.deck);
                setMessage(`💀 ${player.name} 파산!`, 'attack');
            }
        }

        function reshuffleDeckSingle() {
            if (singlePlayerState.discardPile.length <= 1) return;
            const topCard = singlePlayerState.discardPile.pop();
            shuffle(singlePlayerState.discardPile);
            singlePlayerState.deck.push(...singlePlayerState.discardPile);
            singlePlayerState.discardPile = [topCard];
        }

        function isGameOverSingle() {
            const remaining = players.filter(p => !p.isBankrupt && p.rank === null);
            return remaining.length <= 1;
        }

        function nextTurnSingle() {
            // 왓치독 초기화 (턴 시작 시 무조건 리셋)
            if (aiTurnWatchdog) {
                clearTimeout(aiTurnWatchdog);
                aiTurnWatchdog = null;
            }

            const activePlayers = players.filter(p => !p.isBankrupt && p.rank === null);

            if (activePlayers.length <= 1) {
                if (activePlayers.length === 1 && activePlayers[0].rank === null) {
                    const nextRank = players.filter(p => p.rank !== null).length + 1;
                    activePlayers[0].rank = nextRank;
                }
                endGameSingle();
                return;
            }

            // 2명 남았을 때 스킵 강제 고정 로직 제거 (K카드별 로직으로 대체)

            while (singlePlayerState.skipTurns > 0) {
                singlePlayerState.currentPlayerIndex = (singlePlayerState.currentPlayerIndex + singlePlayerState.direction + players.length) % players.length;
                while (players[singlePlayerState.currentPlayerIndex].isBankrupt || players[singlePlayerState.currentPlayerIndex].rank !== null) {
                    singlePlayerState.currentPlayerIndex = (singlePlayerState.currentPlayerIndex + singlePlayerState.direction + players.length) % players.length;
                }
                singlePlayerState.skipTurns--;
            }

            singlePlayerState.currentPlayerIndex = (singlePlayerState.currentPlayerIndex + singlePlayerState.direction + players.length) % players.length;

            let safety = 0;
            while ((players[singlePlayerState.currentPlayerIndex].isBankrupt || players[singlePlayerState.currentPlayerIndex].rank !== null) && safety < players.length) {
                singlePlayerState.currentPlayerIndex = (singlePlayerState.currentPlayerIndex + singlePlayerState.direction + players.length) % players.length;
                safety++;
            }

            if (isGameOverSingle()) {
                const survivor = players.find(p => !p.isBankrupt && p.rank === null);
                if (survivor) survivor.rank = players.filter(p => p.rank !== null).length + 1;
                endGameSingle();
                return;
            }

            renderSingle();

            const cp = players[singlePlayerState.currentPlayerIndex];
            if (cp.isHuman) {
                // 내 턴 알림음 재생 (온라인과 동일)
                playTurnSound();

                if (singlePlayerState.attackStack > 0) {
                    console.log(`⚔️ Human Turn: Attack Stack = ${singlePlayerState.attackStack}`);
                    setMessage(`⚔️ ${singlePlayerState.attackStack}장 공격! 방어 또는 뽑기`, 'attack');
                } else {
                    console.log('🛡️ Human Turn: No Attack');
                    setMessage('당신의 턴');
                }
            } else {
                setMessage(`🤖 ${cp.name} 생각 중...`); // AI 턴 메시지 표시
                const delay = 1000 + Math.random() * 2000;

                // 왓치독 설정 (5초 안에 다음 턴 안 오면 강제 진행)
                aiTurnWatchdog = setTimeout(() => {
                    console.error('🚨 AI Turn Watchdog Triggered! Forcing next turn...');
                    // 페널티로 카드 1장 먹임
                    const player = players[singlePlayerState.currentPlayerIndex];
                    if (player && !player.isHuman) {
                        drawCardsForPlayerSingle(player);
                        renderSingle();
                    }
                    nextTurnSingle();
                }, 5000);

                setTimeout(aiTurnSingle, delay);
            }
        }

        // === AI 싱글 플레이어 턴 ===
        function aiTurnSingle() {
            try {
                const player = players[singlePlayerState.currentPlayerIndex];
                if (!player || player.isHuman || player.isBankrupt || player.rank !== null) {
                    nextTurnSingle();
                    return;
                }

                // 플레이 가능한 카드 찾기
                let playable = [];
                for (let i = 0; i < player.hand.length; i++) {
                    if (canPlayCardSingle(player.hand[i])) {
                        playable.push({ index: i, card: player.hand[i] });
                    }
                }

                // 플레이 가능한 카드가 없으면 드로우
                if (playable.length === 0) {
                    drawCardsForPlayerSingle(player);
                    renderSingle();
                    setTimeout(nextTurnSingle, 500);
                    return;
                }

                // 난이도별 AI 선택
                let chosenCards = [];

                try {
                    if (aiDifficulty === 'beginner') {
                        // 초급: 랜덤 선택
                        chosenCards = [playable[Math.floor(Math.random() * playable.length)]];
                    } else if (aiDifficulty === 'intermediate') {
                        chosenCards = selectSmartAI(player, playable);
                    } else if (aiDifficulty === 'advanced') {
                        chosenCards = selectCountingAI(player, playable);
                    } else if (aiDifficulty === 'expert') {
                        chosenCards = selectExpertAI(player, playable);
                    } else {
                        // 기본값: 스마트 AI
                        chosenCards = selectSmartAI(player, playable);
                    }
                } catch (err) {
                    console.error('AI Strategy Selection Error:', err);
                    chosenCards = [playable[0]];
                }

                // fallback
                if (!chosenCards || chosenCards.length === 0) {
                    chosenCards = [playable[0]];
                }

                // 카드 플레이
                const indices = chosenCards.map(pc => pc.index).sort((a, b) => b - a);
                const cards = indices.map(i => player.hand[i]);
                indices.forEach(i => player.hand.splice(i, 1));
                cards.forEach(card => singlePlayerState.discardPile.push(card));
                playCardPlaySound();

                const lastCard = cards[cards.length - 1];
                if (lastCard.suit !== 'black-joker' && lastCard.suit !== 'color-joker') {
                    singlePlayerState.currentSuit = lastCard.suit;
                }

                // 7카드로 무늬 변경 (AI가 가장 많이 가진 무늬로)
                if (lastCard.value === '7') {
                    console.log('🐞 AI played 7. Changing suit...');
                    const suits = ['spade', 'heart', 'diamond', 'club'];
                    let bestSuit = suits[0], maxCount = 0;
                    suits.forEach(s => {
                        const cnt = player.hand.filter(c => c.suit === s).length;
                        if (cnt > maxCount) { maxCount = cnt; bestSuit = s; }
                    });
                    singlePlayerState.currentSuit = bestSuit;
                    console.log(`🐞 Best suit selected: ${bestSuit}`);

                    // 7카드 무늬 변경 알림
                    const suitNameText = { 'spade': '♠ 스페이드', 'heart': '♥ 하트', 'diamond': '♦ 다이아몬드', 'club': '♣ 클로버' };
                    showNotification(`${player.name}님이 문양을 ${suitNameText[bestSuit]} (으)로 바꿨습니다!`);
                    playSuitChangeSound();
                } else {
                    console.log(`🐞 AI played card value: ${lastCard.value} (Not 7)`);
                }

                handleSpecialCardsSingle(cards);

                // 승리 체크
                if (player.hand.length === 0) {
                    const currentRank = players.filter(p => p.rank !== null).length + 1;
                    player.rank = currentRank;
                    setMessage(`🎉 ${player.name}님이 ${currentRank}등으로 탈출!`);
                    renderSingle();

                    if (isGameOverSingle()) {
                        setTimeout(endGameSingle, 1500);
                    } else {
                        setTimeout(nextTurnSingle, 1500);
                    }
                    return;
                }

                renderSingle();
                setTimeout(nextTurnSingle, 800);
            } catch (e) {
                console.error('CRITICAL AI TURN ERROR:', e);
                // 치명적 오류 발생 시 강제로 다음 턴으로 넘김
                setTimeout(nextTurnSingle, 1000);
            }
        }

        // === 난이도별 AI 선택 함수 ===

        // 🟢 고급: 카운팅 AI (상대 패 수 파악 후 공격 우선)
        function selectCountingAI(player, playable) {
            // 가장 위협적인 상대(카드가 가장 적은 사람) 찾기
            const opponents = players.filter(p => p.id !== player.id && !p.isBankrupt && p.rank === null);
            let targetPlayer = null;
            let targetHandCount = 99;

            if (opponents.length > 0) {
                // 핸드 수가 가장 적은 상대 찾기
                opponents.forEach(p => {
                    if (p.hand.length < targetHandCount) {
                        targetHandCount = p.hand.length;
                        targetPlayer = p;
                    }
                });
            }

            // 상대가 3장 이하면 공격 모드
            if (targetHandCount <= 3) {
                // 공격 카드 우선 (Joker > A > 2 > K > Q > J)
                const attackCards = playable.filter(pc =>
                    ['black-joker', 'color-joker', 'A', '2', 'K', 'Q', 'J'].includes(pc.card.value) ||
                    pc.card.suit.includes('joker')
                );

                if (attackCards.length > 0) {
                    // 공격력 높은 순 정렬 (Joker=50, A=40, 2=30, K=20...)
                    attackCards.sort((a, b) => {
                        const getVal = (c) => {
                            if (c.suit.includes('joker')) return 50;
                            if (c.value === 'A') return 40;
                            if (c.value === '2') return 30;
                            if (c.value === 'K') return 20;
                            if (c.value === 'Q') return 15;
                            if (c.value === 'J') return 10;
                            return 0;
                        };
                        return getVal(b.card) - getVal(a.card);
                    });
                    return [attackCards[0]];
                }
            }

            // 평소에는 스마트 AI 로직 따름
            return selectSmartAI(player, playable);
        }

        // 🟣 최고급: 전문가 AI (가중치 기반 최적화)
        function selectExpertAI(player, playable) {
            // 학습된 가중치 사용
            const w = aiWeights || {
                jokerSaveWeight: 1.0,
                earlyAttackWeight: 1.0,
                normalFirstWeight: 1.0,
                counterAttackWeight: 1.0
            };

            const jokers = playable.filter(pc => pc.card.suit.includes('joker'));
            const attacks = playable.filter(pc => ['A', '2'].includes(pc.card.value));
            const specials = playable.filter(pc => ['J', 'Q', 'K'].includes(pc.card.value));
            const normals = playable.filter(pc => !pc.card.suit.includes('joker') && !['A', '2', 'J', 'Q', 'K', '7'].includes(pc.card.value));

            const isUnderAttack = singlePlayerState.attackStack > 0;
            const myCount = player.hand.length;

            // 1. 방어 (필수)
            if (isUnderAttack) {
                // 방어 카드는 무조건 내야 함 (이미 playable에 걸러짐)
                return [playable[0]];
            }

            // 2. 조커 아끼기 (가중치 적용)
            if (myCount > 5 && jokers.length > 0 && Math.random() < w.jokerSaveWeight) {
                const others = playable.filter(pc => !pc.card.suit.includes('joker'));
                if (others.length > 0) return selectExpertAI(player, others);
            }

            // 3. 조기 공격 (가중치 적용)
            if (attacks.length > 0 && Math.random() < w.earlyAttackWeight) {
                return [attacks[0]];
            }

            // 4. 일반 카드 털기 (가중치 적용)
            if (normals.length > 0 && Math.random() < w.normalFirstWeight) {
                const groups = {};
                normals.forEach(pc => {
                    const v = pc.card.value;
                    if (!groups[v]) groups[v] = [];
                    groups[v].push(pc);
                });
                let bestGroup = normals[0];
                let maxLen = 0;
                for (const v in groups) {
                    if (groups[v].length > maxLen) {
                        maxLen = groups[v].length;
                        bestGroup = [groups[v][0]]; // 주의: groups[v]는 배열이므로 하나만 선택 or 추후 멀티 플레이 지원
                        // 현재 로직상 chosenCards는 배열이어야 함. 
                        // selectSmartAI 로직 참조: chosenCards = same; (배열 전체)
                        bestGroup = groups[v];
                    }
                }
                return bestGroup;
            }

            // 기본: 스마트 AI
            return selectSmartAI(player, playable);
        }

        // 🟡 중급: 스마트 AI (조커/A 보존, 일반 카드 우선)
        function selectSmartAI(player, playable) {
            const jokers = playable.filter(pc => pc.card.suit === 'black-joker' || pc.card.suit === 'color-joker');

            } else if (canWinNow) {
                chosenCards = [playable[0]];
            } else if (minOpponentHandCount <= 2 && twos.length > 0) {
                chosenCards = twos;
            } else if (normals.length > 0) {
                // 같은 숫자 그룹 중 가장 많은 것
                const groups = {};
                normals.forEach(pc => {
                    const val = pc.card.value;
                    if (!groups[val]) groups[val] = [];
                    groups[val].push(pc);
                });
                let best = null;
                for (let val in groups) {
                    if (!best || groups[val].length > best.length) best = groups[val];
                }
                chosenCards = best;
            } else if (sevens.length > 0 && !isEmergency) {
                chosenCards = [sevens[0]];
            } else if (twos.length > 0) {
                chosenCards = [twos[0]];
            } else if (aces.length > 0 && isEmergency) {
                chosenCards = [aces[0]];
            } else if (jokers.length > 0 && isEmergency) {
                chosenCards = [jokers[0]];
            } else {
                chosenCards = [playable[0]];
            }

            // 같은 숫자 묶기
            if (chosenCards.length > 0) {
                const val = chosenCards[0].card.value;
                const same = playable.filter(pc => pc.card.value === val);
                if (same.length > chosenCards.length) chosenCards = same;
            }

            return chosenCards.length > 0 ? chosenCards : [playable[0]];
        }

        // 🟠 고급: 카드 카운팅 AI
        function selectCountingAI(player, playable) {

                if (!playerLikelyHasDefense || minOpponentHandCount === 1) {
                    if (twos.length > 0) chosenCards = twos;
                    else if (jokers.length > 0) chosenCards = [jokers[0]];

            if (chosenCards.length === 0) {
                if (normals.length > 0) {
                    const groups = {};

                    }
                    chosenCards = best;
                } else if (sevens.length > 0 && !isEmergency) {
                    chosenCards = [sevens[0]];
                } else if (twos.length > 0) {

                } else if (aces.length > 0 && isEmergency) {

            }

            if (chosenCards.length > 0) {
                const val = chosenCards[0].card.value;

        // 🔴 최고급: 가중치 학습 AI
        function selectExpertAI(player, playable) {
            const cardCounts = getCardCounts();
            const jokers = playable.filter(pc => pc.card.suit === 'black-joker' || pc.card.suit === 'color-joker');
            const aces = playable.filter(pc => pc.card.value === 'A');
            const twos = playable.filter(pc => pc.card.value === '2');
            const normals = playable.filter(pc =>
                pc.card.suit !== 'black-joker' && pc.card.suit !== 'color-joker' &&
                pc.card.value !== 'A' && pc.card.value !== '2' && pc.card.value !== '7'
            );

            const myCardCount = player.hand.length;
            const canWinNow = myCardCount === 1;

            let chosenCards = [];

            if (isUnderAttack) {
                if (twos.length > 0) chosenCards = [twos[0]];
                else if (aces.length > 0) chosenCards = [aces[0]];
                else if (jokers.length > 0) chosenCards = [jokers[0]];
            } else if (canWinNow) {
                chosenCards = [playable[0]];
            } else {
                // 가중치 기반 전략 선택
                const strategies = [];

                if (normals.length > 0) {
                    strategies.push({ weight: aiWeights.normalFirstWeight, cards: normals });
                }
                if (twos.length > 0) {
                    strategies.push({ weight: aiWeights.earlyAttackWeight * 0.5, cards: twos });
                }

                // 조커 보존 (가중치 높으면 사용 안함)
                if (jokers.length > 0 && myCardCount <= 3 && aiWeights.jokerSaveWeight < 1.0) {
                    strategies.push({ weight: 2 - aiWeights.jokerSaveWeight, cards: jokers });
                }

                if (strategies.length > 0) {
                    const totalWeight = strategies.reduce((sum, s) => sum + s.weight, 0);
                    let rand = Math.random() * totalWeight;
                    for (let s of strategies) {
                        rand -= s.weight;
                        if (rand <= 0) {
                            chosenCards = [s.cards[0]];
                            break;
                        }
                    }
                }
            }

            if (chosenCards.length === 0) {
                chosenCards = [playable[0]];
            }

            // 같은 숫자 묶기
            if (chosenCards.length > 0) {
                const val = chosenCards[0].card.value;
                const same = playable.filter(pc => pc.card.value === val);
                if (same.length > chosenCards.length) chosenCards = same;
            }

            return chosenCards.length > 0 ? chosenCards : [playable[0]];
        }

        // === 카드 카운팅 AI 헬퍼 ===
        function getCardCounts() {
            // 덱 구성: 각 숫자 4장씩 (스페이드/하트/다이아/클로버), 조커 2장
            const totalCards = {
                '2': 4, '3': 4, '4': 4, '5': 4, '6': 4, '7': 4, '8': 4, '9': 4, '10': 4,
                'J': 4, 'Q': 4, 'K': 4, 'A': 4, 'JOKER': 2
            };
            const suitTotal = { 'spade': 13, 'heart': 13, 'diamond': 13, 'club': 13 };

            // 버린 카드 집계
            const playedValues = {};
            const playedSuits = {};

            singlePlayerState.discardPile.forEach(card => {
                const val = card.value;
                playedValues[val] = (playedValues[val] || 0) + 1;

                if (card.suit !== 'black-joker' && card.suit !== 'color-joker') {
                    playedSuits[card.suit] = (playedSuits[card.suit] || 0) + 1;
                }
            });

            // 남은 카드 계산
            const remainingValues = {};
            for (let val in totalCards) {
                remainingValues[val] = totalCards[val] - (playedValues[val] || 0);
            }

            const remainingSuits = {};
            for (let suit in suitTotal) {
                remainingSuits[suit] = suitTotal[suit] - (playedSuits[suit] || 0);
            }

            return { remainingValues, remainingSuits, playedValues, playedSuits };
        }

        function aiTurnSingle() {
            const player = players[singlePlayerState.currentPlayerIndex];
            if (player.isBankrupt || player.isHuman) return;

            let playable = [];
            for (let i = 0; i < player.hand.length; i++) {
                if (canPlayCardSingle(player.hand[i])) {
                    playable.push({ index: i, card: player.hand[i] });
                }
            }

            if (playable.length === 0) {
                drawCardsForPlayerSingle(player);
                nextTurnSingle();

            // 배틀 모드 등에서는 플레이어별 난이도가 우선, 없으면 글로벌 설정
            const currentDiff = player.difficulty || aiDifficulty;

            if (currentDiff === 'beginner') {
                // 🟢 초급: 랜덤 선택
                chosenCards = [playable[Math.floor(Math.random() * playable.length)]];
            } else if (currentDiff === 'intermediate') {
                // 🟡 중급: 스마트 AI (조커/A 보존)
                chosenCards = selectSmartAI(player, playable);
            } else if (currentDiff === 'advanced') {
                // 🟠 고급: 카드 카운팅 AI
                chosenCards = selectCountingAI(player, playable);
            } else if (currentDiff === 'expert') {
                // 🔴 최고급: 가중치 학습 AI
                chosenCards = selectExpertAI(player, playable);
            } else {
                chosenCards = [playable[0]];
            }

            // 안전장치
            if (chosenCards.length === 0) {
                chosenCards = [playable[0]];
            }

            const bestGroup = chosenCards;

            const indices = bestGroup.map(pc => pc.index).sort((a, b) => b - a);
            const cards = indices.map(i => player.hand[i]);

            indices.forEach(i => player.hand.splice(i, 1));
            cards.forEach(card => singlePlayerState.discardPile.push(card));
            playCardPlaySound();

            const lastCard = cards[cards.length - 1];
            if (lastCard.suit !== 'black-joker' && lastCard.suit !== 'color-joker') {
                singlePlayerState.currentSuit = lastCard.suit;
            }

            // AI가 7을 냈을 때 무늬 선택 (카운팅 기반!)
            if (lastCard.value === '7') {
                const cardCounts = getCardCounts(); // ReferenceError 수정: 함수 호출로 변수 정의

                // 카운팅: 게임에 남은 무늬 수 + 내 손에 있는 무늬 수 종합 고려
                const suitScores = {};
                ['spade', 'heart', 'diamond', 'club'].forEach(suit => {
                    // 내 손에 있는 해당 무늬 카드 수
                    const myCount = player.hand.filter(c => c.suit === suit).length;
                    // 게임에 남아있는 해당 무늬 카드 수 (확률적으로 유리)
                    const gameRemaining = cardCounts.remainingSuits[suit] || 0;
                    // 점수: 내 카드 * 3 + 게임 남은 수 (내 카드 우선)
                    suitScores[suit] = (myCount * 3) + gameRemaining;
                });

                let bestSuit = singlePlayerState.currentSuit;
                let maxScore = 0;
                for (let suit in suitScores) {
                    if (suitScores[suit] > maxScore) {
                        maxScore = suitScores[suit];
                        bestSuit = suit;
                    }
                }
                singlePlayerState.currentSuit = bestSuit;

                // 알림
                const suitNameText = { 'spade': '♠ 스페이드', 'heart': '♥ 하트', 'diamond': '♦ 다이아몬드', 'club': '♣ 클로버' };
                showNotification(`${player.name}님이 문양을 ${suitNameText[bestSuit]} (으)로 바꿨습니다!`);
                playSuitChangeSound();
            }

            handleSpecialCardsSingle(cards);

            if (player.hand.length === 0) {
                const currentRank = players.filter(p => p.rank !== null).length + 1;
                player.rank = currentRank;
                setMessage(`🎊 ${player.name}님이 ${currentRank}등으로 탈출!`);
                renderSingle();
                if (isGameOverSingle()) {
                    setTimeout(endGameSingle, 1500);
                } else {
                    setTimeout(nextTurnSingle, 1500);
                }
                return;
            }

            nextTurnSingle();
        }

                let kSkips = 0;

                if (activeCount <= 2) {
                    // 2인: 짝수 장(내 턴), 홀수 장(상대 턴)
                    kSkips = (count * 2);
                    if (count % 2 === 0) kSkips -= 1;
                } else {
                    // 3인 이상: 1장당 3칸 이동
                    kSkips = (count * 3) - 1;
                }

                newSkipTurns += kSkips;
                newAttackStack = 0;
                newAttackType = null;
            } else if (value === 'Q') {
                const activeCount = players.filter(p => !p.isBankrupt && p.hand.length > 0 && p.connected !== false).length;
                if (activeCount <= 2) {
                    newSkipTurns += 1 * count;
                } else if (count % 2 === 1) {
                    newDirection *= -1;
                }
                newAttackStack = 0;
                newAttackType = null;
            } else if (value === 'J') {
                const activeCount = players.filter(p => !p.isBankrupt && p.hand.length > 0 && p.connected !== false).length;
                let jSkips = 0;

                if (activeCount <= 2) {
                    // 2인: 몇 장을 내든 상대방을 건너뛰어 내 차례 (Skip 1회 고정)
                    jSkips = 1;
                } else {
                    // 3인 이상: 1장당 2칸 이동
                    jSkips = (count * 2) - 1;
                }

                newSkipTurns += jSkips;
                newAttackStack = 0;
                newAttackType = null;
            } else {
                newAttackStack = 0;
                newAttackType = null;
            }

            // 다음 턴 계산
            let nextPlayerIndex = gameState.currentPlayerIndex;
            const totalPlayers = players.length;

            // 스킵 처리
            // 기존 2인 클램프 제거됨

            for (let i = 0; i <= newSkipTurns; i++) {
                nextPlayerIndex = (nextPlayerIndex + newDirection + totalPlayers) % totalPlayers;
                // 파산하거나 승리한 플레이어 건너뛰기
                let safety = 0;
                while ((players[nextPlayerIndex].isBankrupt || players[nextPlayerIndex].hand.length === 0 || players[nextPlayerIndex].connected === false) && safety < totalPlayers) {
                    nextPlayerIndex = (nextPlayerIndex + newDirection + totalPlayers) % totalPlayers;
                    safety++;
                }
            }
            newSkipTurns = 0;

            // 7카드 무늬 선택이 필요한 경우
            if (value === '7' && cardsToPlay[0].suit !== 'black-joker' && cardsToPlay[0].suit !== 'color-joker') {
                document.getElementById('suit-selector').style.display = 'flex';
                // 임시 저장
                window.pendingUpdate = {
                    newHand, newDiscardPile, newDeck, newAttackStack, newAttackType,
                    newSkipTurns, newDirection, nextPlayerIndex, expectedTurnIndex
                };
                selectedCards = [];
                return;
            }

            // 승리 조건 확인 (손패 0장)
            let gameStatus = gameState.status || 'playing';
            let winner = null;

            if (newHand.length === 0) {
                gameStatus = 'finished';
                winner = myPlayerId;
            }

            // Firebase 업데이트
            const updates = {
                deck: newDeck,
                discardPile: newDiscardPile,
                currentPlayerIndex: nextPlayerIndex,
                direction: newDirection,
                attackStack: newAttackStack,
                attackType: newAttackType,
                currentSuit: newCurrentSuit,
                skipTurns: 0,
                [`hands/${myPlayerId}`]: newHand
            };

            if (winner) {
                updates.status = 'finished';
                updates.winner = winner;
            }

            updateGameState(updates, {
                expectedTurnIndex,
                actorId: myPlayerId
            });

            // 즉시 UI 업데이트
            selectedCards = [];
            document.getElementById('action-buttons').style.display = 'none';
        };

        const selectSuitOnlineOriginal = function (suit) {
            document.getElementById('suit-selector').style.display = 'none';
            if (window.pendingUpdate) {
                const { newHand, newDiscardPile, newDeck, newAttackStack, newAttackType,
                    newSkipTurns, newDirection, nextPlayerIndex, expectedTurnIndex } = window.pendingUpdate;

                // 알림 메시지 생성
                const suitNames = { 'spade': '♠ 스페이드', 'heart': '♥ 하트', 'diamond': '♦ 다이아몬드', 'club': '♣ 클로버' };
                const actorName = sanitizeNickname(myNickname) || '플레이어';
                const msg = `${actorName}님이 문양을 ${suitNames[suit]}로 바꿨습니다!`;
                playSuitChangeSound(); // 소리 추가

                const updates = {
                    deck: newDeck,
                    discardPile: newDiscardPile,
                    currentPlayerIndex: nextPlayerIndex,
                    direction: newDirection,
                    attackStack: newAttackStack,
                    attackType: newAttackType,
                    currentSuit: suit,
                    skipTurns: 0,
                    lastAction: msg,
                    lastActionId: Date.now(),
                    [`hands/${myPlayerId}`]: newHand
                };

                // 승리 체크 (손패가 0장이면 승리)
                if (newHand.length === 0) {
                    updates.status = 'finished';
                    updates.winner = myPlayerId;
                }

                updateGameState(updates, {
                    expectedTurnIndex,
                    actorId: myPlayerId
                });
                window.pendingUpdate = null;
            }
        };

        const drawCardOnlineOriginal = function () {
            const currentPlayer = players[gameState.currentPlayerIndex];
            if (!currentPlayer || !currentPlayer.isMe) {
                alert('당신의 턴이 아닙니다!');
                return;
            }
            const myPlayer = players.find(p => p.isMe);
            if (!myPlayer) return;
            const expectedTurnIndex = gameState.currentPlayerIndex;
            const cardsToDraw = gameState.attackStack > 0 ? gameState.attackStack : 1;
            const newDeck = [...gameState.deck];
            let newDiscardPile = [...gameState.discardPile];
            const newHand = [...myPlayer.hand];
            for (let i = 0; i < cardsToDraw; i++) {
                if (newDeck.length === 0) {
                    if (newDiscardPile.length <= 1) break; // 섞을 카드가 없으면 중단

                    const topCard = newDiscardPile[newDiscardPile.length - 1];
                    const reshuffled = newDiscardPile.slice(0, -1);
                    shuffle(reshuffled);
                    newDeck.push(...reshuffled);
                    newDiscardPile = [topCard]; // 버린 카드 더미 초기화 (맨 위 1장만 남김)
                }
                if (newDeck.length > 0) newHand.push(newDeck.pop());
            }
            let nextPlayerIndex = (gameState.currentPlayerIndex + gameState.direction + players.length) % players.length;
            let safety = 0;
            while ((players[nextPlayerIndex].isBankrupt || players[nextPlayerIndex].hand.length === 0 || players[nextPlayerIndex].connected === false) && safety < players.length) {
                nextPlayerIndex = (nextPlayerIndex + gameState.direction + players.length) % players.length;
                safety++;
            }

            // 조커 공격 후 카드를 먹으면 다음 사람은 아무 카드나 낼 수 있음
            const wasJokerAttack = gameState.attackType === 'black-joker' || gameState.attackType === 'color-joker';
            const nextSuit = wasJokerAttack ? 'any' : gameState.currentSuit;

            // 파산 체크 (15장 초과)
            // const BANKRUPT_LIMIT = 15; // 전역 상수로 이동됨
            let isBankrupt = newHand.length > BANKRUPT_LIMIT;

            const updates = {
                deck: newDeck,
                discardPile: newDiscardPile,
                currentPlayerIndex: nextPlayerIndex,
                attackStack: 0,
                attackType: null,
                currentSuit: nextSuit,
                [`hands/${myPlayerId}`]: isBankrupt ? [] : newHand
            };

            if (isBankrupt) {
                updates[`players/${myPlayerId}/isBankrupt`] = true;

                // 활성 플레이어 수 체크
                const activePlayers = players.filter(p => !p.isBankrupt && p.hand.length > 0 && p.connected !== false);
                // 나를 제외한 활성 플레이어
                const remainingPlayers = activePlayers.filter(p => p.id !== myPlayerId);

                if (remainingPlayers.length === 1) {
                    // 마지막 남은 사람이 승리
                    updates.status = 'finished';
                    updates.winner = remainingPlayers[0].id;
                }

                alert('카드가 15장을 초과하여 파산했습니다! 😱');
            }

            updateGameState(updates, {
                expectedTurnIndex,
                actorId: myPlayerId
            });
        };

        function showNotification(msg) {
            let el = document.getElementById('game-notification');
            if (!el) {
                // 동적 생성
                el = document.createElement('div');
                el.id = 'game-notification';
                el.className = 'game-notification';
                document.body.appendChild(el);

                const style = document.createElement('style');
                style.innerHTML = `
        .game-notification {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fbbf24;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            z-index: 200;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid #fbbf24;
            animation: slideDown 0.3s ease-out;
            white-space: nowrap;
            font-weight: bold;
        }
        @keyframes slideDown {
            from { top: 10%; opacity: 0; }
            to { top: 20%; opacity: 1; }
        }
                `;
                document.head.appendChild(style);
            }

            el.textContent = String(msg ?? '');
            el.style.display = 'block';

            if (window.notificationTimer) clearTimeout(window.notificationTimer);
            window.notificationTimer = setTimeout(() => {
                el.style.display = 'none';
            }, 7000);  // 5초 -> 7초
        }
        // 새로고침/뒤로가기 방지
        window.addEventListener('beforeunload', (e) => {
            // 게임 화면이 보이고, 게임이 종료되지 않았을 때만 경고
            const gameScreen = document.getElementById('game-screen');
            const isPlaying = gameScreen && !gameScreen.classList.contains('hidden');

            // 싱글 플레이거나 온라인 룸에 연결되어 있을 때
            if (isPlaying) {
                // 게임 종료 상태가 아니어야 함 (승리/패배 화면이 뜬 상태면 경고 불필요할 수도 있지만, 대기실 나가기 전이므로 띄우는 게 안전)
                e.preventDefault();
                e.returnValue = ''; // 표준
            }
        });

        // 키보드 단축키 (Enter)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                try {
                    // 게임 화면 표시 여부 우선 확인
                    const gameScreen = document.getElementById('game-screen');
                    if (!gameScreen || gameScreen.classList.contains('hidden')) {
                        return;
                    }

                    // 내 턴 체크
                    let isMyTurn = false;
                    let myHand = [];

                    if (isSinglePlayer) {
                        const player = players.find(p => p.isHuman);
                        if (!player) return;

                        const playerIndex = players.indexOf(player);
                        isMyTurn = singlePlayerState.currentPlayerIndex === playerIndex;
                        myHand = player.hand;
                    } else {
                        // Online
                        if (!gameState) return;
                        const currentPlayer = players[gameState.currentPlayerIndex];
                        isMyTurn = currentPlayer && currentPlayer.isMe;

                        // 내 핸드 찾기 (Online)
                        const me = players.find(p => p.isMe);
                        if (me) myHand = me.hand;
                    }

                    if (isMyTurn) {
                        // 카드 선택 여부 확인
                        if (typeof selectedCards === 'undefined') return;

                        e.preventDefault();

                        if (selectedCards.length > 0) {
                            playSelectedCardsOnline();
                        } else {
                            // !!! 중요: 낼 수 있는 카드가 하나라도 있으면 드로우(Enter) 금지 !!!
                            let hasPlayableCard = false;

                            for (let card of myHand) {
                                if (isSinglePlayer) {
                                    if (canPlayCardSingle(card)) {
                                        hasPlayableCard = true;
                                        break;
                                    }
                                } else {
                                    if (canPlayCard(card)) {
                                        hasPlayableCard = true;
                                        break;
                                    }
                                }
                            }

                            if (hasPlayableCard) {
                                // 1초 이내에 다시 눌렀는지 확인 (강제 드로우)
                                const now = Date.now();
                                if (window.lastEnterPressTime && (now - window.lastEnterPressTime < 1000)) {
                                    // 더블 엔터 -> 강제 드로우
                                    drawCardOnline();
                                    window.lastEnterPressTime = 0;
                                } else {
                                    // 첫 번째 엔터 -> 경고 메시지
                                    showNotification('카드를 낼 수 있습니다! 드로우하려면 엔터를 한 번 더 누르세요.', 'warning');
                                    window.lastEnterPressTime = now;
                                }
                                return;
                            }

                            drawCardOnline();
                        }
                    }
                } catch (err) {
                    console.error('Keyboard Error:', err);
                }
            }
        });

        // 페이지 로드 시 저장된 닉네임 불러오기
        (function initNickname() {
            const saved = localStorage.getItem('onecard_nickname');
            if (saved) {
                document.getElementById('nickname-input').value = saved;
            }

            // AI 가중치 로드 (서버 + localStorage)
            loadAIWeights();
        })();

        // 닉네임 입력 시 저장
        document.getElementById('nickname-input').addEventListener('input', function (e) {
            localStorage.setItem('onecard_nickname', e.target.value);
        });

        // 브라우저 종료/새로고침 시 AI 가중치 자동 저장
        window.addEventListener('beforeunload', function (e) {
            if (isAITrainingMode) {
                saveAIWeights();
                // 브라우저 종료 시 다운로드 시도 (일부 브라우저에서는 차단될 수 있음)
                try {
                    downloadAIWeights();
                } catch (err) {
                    console.log('다운로드 차단됨 - localStorage에는 저장됨');
                }
                console.log('브라우저 종료 - AI 가중치 자동 저장됨');
            }
        });
    </script>
